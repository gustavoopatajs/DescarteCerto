<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Descarte Certo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #2E7D32;
      background: radial-gradient(circle, rgba(46, 125, 50, 1) 0%, rgba(27, 94, 32, 1) 35%, rgba(245, 220, 220, 1) 100%);
    }

    .formulario {
      background-color: white;
      border: 1px solid #d8d8cc;
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      margin: 20px auto;
    }

    .formulario h2 {
      color: #1e5e1e;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .formulario p {
      color: #6b7c6b;
      font-size: 13px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #1e5e1e;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d8d8cc;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 15px;
      color: #333;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2e7d32;
    }

    .btn-cadastrar {
      width: 100%;
      background-color: #f5a623;
      color: black;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-cadastrar:hover {
      background-color: #e08f00;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #6b7c6b;
    }

    .login-link a {
      color: #2e7d32;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="formulario">

    <h2>Criar conta</h2>
    <p>Cadastre-se para encontrar pontos de coleta perto de você.</p>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" placeholder="Seu nome">

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seu@email.com">

    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Crie uma senha">

    <label for="tipo">Tipo de conta</label>
    <select id="tipo">
      <option value="">Selecione...</option>
      <option value="cidadao">Cidadão</option>
      <option value="catador">Catador</option>
      <option value="cooperativa">Cooperativa</option>
    </select>

    <button class="btn-cadastrar">Cadastrar</button>

    <p class="login-link">
      Já tem conta? <a href="#">Entrar</a>
    </p>

  </div>

</body>
</html>
